<g transform="translate(20 20)"><text x="400" y="22" font-size="17" font-weight="700" text-anchor="middle" fill="#1d1f25">Eine Methode ist eine Disziplin, kein Prompt.</text><text x="400" y="41" font-size="11.5" text-anchor="middle" fill="#5b6472">Beispiel: Engpasstheorie, Iteration 2.1</text><rect x="20" y="56" width="760" height="38" rx="10" fill="rgba(29,31,37,0.04)" stroke="rgba(29,31,37,0.30)" stroke-width="1" stroke-dasharray="4 4"/><text x="36" y="79" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#5b6472">NUR EIN PROMPT</text><rect x="176" y="67" width="48" height="16" rx="8" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><text x="200" y="79" font-size="11" font-weight="700" text-anchor="middle" fill="#5b6472">?</text><path d="M228 75 H246" stroke="rgba(29,31,37,0.30)" stroke-width="1.4" fill="none"/><path d="M250 75 l-6 -3.5 v7 z" fill="rgba(29,31,37,0.30)"/><rect x="254" y="67" width="34" height="16" rx="4" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><text x="271" y="79" font-size="10" font-weight="700" text-anchor="middle" fill="#5b6472">AI</text><path d="M292 75 H310" stroke="rgba(29,31,37,0.30)" stroke-width="1.4" fill="none"/><path d="M314 75 l-6 -3.5 v7 z" fill="rgba(29,31,37,0.30)"/><rect x="318" y="67" width="56" height="16" rx="8" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><path d="M328 75 H364" stroke="rgba(29,31,37,0.30)" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="394" y="79" font-size="11" fill="#5b6472">Eine Frage hinein, eine Antwort heraus. Nichts prüft sie.</text><text x="20" y="122" font-size="13" font-weight="700" fill="#f8991d" letter-spacing="1.4">EINE LOOM-METHODE</text><rect x="20" y="132" width="175" height="150" rx="14" fill="rgba(29,31,37,0.04)" stroke="rgba(29,31,37,0.30)" stroke-width="1.2"/><circle cx="40" cy="151" r="10" fill="#f8991d"/><text x="40" y="155.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14161c">1</text><text x="58" y="156" font-size="14" font-weight="700" fill="#1d1f25">Die Methode</text><rect x="34" y="172" width="147" height="14" rx="4" fill="rgba(29,31,37,0.09)" stroke="#f8991d" stroke-width="1.6"/><circle cx="43" cy="179" r="2.6" fill="#f8991d"/><text x="52" y="182.5" font-size="9.5" fill="#1d1f25">Engpass finden</text><rect x="34" y="190" width="147" height="14" rx="4" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><circle cx="43" cy="197" r="2.6" fill="#f8991d"/><text x="52" y="200.5" font-size="9.5" fill="#1d1f25">Voll nutzen</text><rect x="34" y="208" width="147" height="14" rx="4" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><circle cx="43" cy="215" r="2.6" fill="#f8991d"/><text x="52" y="218.5" font-size="9.5" fill="#1d1f25">Ausrichten</text><rect x="34" y="226" width="147" height="14" rx="4" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><circle cx="43" cy="233" r="2.6" fill="#f8991d"/><text x="52" y="236.5" font-size="9.5" fill="#1d1f25">Erweitern</text><rect x="34" y="244" width="147" height="14" rx="4" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><circle cx="43" cy="251" r="2.6" fill="#f8991d"/><text x="52" y="254.5" font-size="9.5" fill="#1d1f25">Vorausschauen</text><rect x="41.5" y="273" width="132" height="18" rx="9" fill="#fff" stroke="#f8991d" stroke-width="1.2"/><text x="107.5" y="286" font-size="10" text-anchor="middle" fill="#f8991d" font-weight="700" letter-spacing=".8">EXPERTEN-GEPRÜFT</text><rect x="215" y="132" width="175" height="150" rx="14" fill="rgba(29,31,37,0.04)" stroke="rgba(29,31,37,0.30)" stroke-width="1.2"/><circle cx="235" cy="151" r="10" fill="#f8991d"/><text x="235" y="155.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14161c">2</text><text x="253" y="156" font-size="14" font-weight="700" fill="#1d1f25">Ihre Antworten</text><rect x="229" y="194" width="30" height="9" rx="2.5" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><rect x="271" y="194" width="30" height="9" rx="2.5" fill="rgba(29,31,37,0.09)" stroke="#f8991d" stroke-width="1.6"/><rect x="313" y="194" width="30" height="9" rx="2.5" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><path d="M259 198.5 H271 M301 198.5 H313" stroke="rgba(29,31,37,0.30)" stroke-width="0.9" fill="none"/><g><circle cx="286" cy="180" r="6" fill="#f8991d"/><circle cx="286" cy="180" r="2.2" fill="#fff"/><path d="M282 184 L286 192 L290 184 z" fill="#f8991d"/></g><rect x="229" y="210" width="147" height="30" rx="8" fill="#fff" stroke="#f8991d" stroke-width="1.2"/><text x="238" y="223" font-size="9.5" fill="#1d1f25">Wo wartet die Arbeit</text><text x="238" y="235" font-size="9.5" fill="#1d1f25" font-weight="600">am längsten?</text><path d="M233 252 H343 M233 262 H311" stroke="rgba(29,31,37,0.30)" stroke-width="1.6" stroke-linecap="round" fill="none"/><rect x="315" y="257" width="2.4" height="10" fill="#f8991d"/><rect x="247" y="273" width="111" height="18" rx="9" fill="#fff" stroke="#f8991d" stroke-width="1.2"/><text x="302.5" y="286" font-size="10" text-anchor="middle" fill="#f8991d" font-weight="700" letter-spacing=".8">SIE ANTWORTEN</text><rect x="410" y="132" width="175" height="150" rx="14" fill="rgba(29,31,37,0.04)" stroke="rgba(29,31,37,0.30)" stroke-width="1.2"/><circle cx="430" cy="151" r="10" fill="#f8991d"/><text x="430" y="155.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14161c">3</text><text x="448" y="156" font-size="14" font-weight="700" fill="#1d1f25">Die Checkliste</text><rect x="424" y="172" width="13" height="13" rx="3.5" fill="#f8991d"/><path d="M427.5 178.5 l2.6 2.8 l5 -5.6" stroke="#14161c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="444" y="182" font-size="9.5" fill="#5b6472" >Nennt einen Schritt</text><rect x="424" y="192" width="13" height="13" rx="3.5" fill="#f8991d"/><path d="M427.5 198.5 l2.6 2.8 l5 -5.6" stroke="#14161c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="444" y="202" font-size="9.5" fill="#5b6472" >Belegt es mit einer Zahl</text><rect x="424" y="212" width="13" height="13" rx="3.5" fill="#f8991d"/><path d="M427.5 218.5 l2.6 2.8 l5 -5.6" stroke="#14161c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="444" y="222" font-size="9.5" fill="#5b6472" >Zeigt die Leerlaufzeit</text><rect x="424.5" y="232.5" width="12" height="12" rx="3" fill="none" stroke="#f8991d" stroke-width="1.3"/><text x="444" y="242" font-size="9.5" fill="#1d1f25" font-weight="600">Was ihn entlastet</text><rect x="424" y="256" width="147" height="6" rx="3" fill="rgba(29,31,37,0.09)"/><rect x="424" y="256" width="110" height="6" rx="3" fill="#f8991d"/><rect x="459.5" y="273" width="76" height="18" rx="9" fill="#fff" stroke="#f8991d" stroke-width="1.2"/><text x="497.5" y="286" font-size="10" text-anchor="middle" fill="#f8991d" font-weight="700" letter-spacing=".8">KI PRÜFT</text><rect x="605" y="132" width="175" height="150" rx="14" fill="rgba(29,31,37,0.04)" stroke="rgba(29,31,37,0.30)" stroke-width="1.2"/><circle cx="625" cy="151" r="10" fill="#f8991d"/><text x="625" y="155.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14161c">4</text><text x="643" y="156" font-size="14" font-weight="700" fill="#1d1f25">Der Abschluss</text><rect x="619" y="172" width="147" height="28" rx="8" fill="#fff" stroke="rgba(29,31,37,0.30)" stroke-width="1"/><circle cx="630" cy="182" r="3.2" fill="#f8991d"/><text x="639" y="185" font-size="9.5" font-weight="700" fill="#1d1f25">Befund</text><path d="M629 193 H747" stroke="rgba(29,31,37,0.30)" stroke-width="1.4" stroke-linecap="round" fill="none"/><rect x="619" y="206" width="147" height="28" rx="8" fill="#fff" stroke="rgba(29,31,37,0.30)" stroke-width="1"/><circle cx="630" cy="216" r="3.2" fill="#f8991d"/><text x="639" y="219" font-size="9.5" font-weight="700" fill="#1d1f25">Vorschlag</text><path d="M629 227 H747" stroke="rgba(29,31,37,0.30)" stroke-width="1.4" stroke-linecap="round" fill="none"/><rect x="619" y="242" width="147" height="20" rx="10" fill="none" stroke="#f8991d" stroke-width="1.3" stroke-dasharray="4 3"/><text x="692.5" y="256" font-size="9.5" font-weight="700" text-anchor="middle" fill="#f8991d">Danach: Red Team</text><rect x="651" y="273" width="83" height="18" rx="9" fill="#fff" stroke="#f8991d" stroke-width="1.2"/><text x="692.5" y="286" font-size="10" text-anchor="middle" fill="#f8991d" font-weight="700" letter-spacing=".8">GEMEINSAM</text><path d="M199 200 l8 7 l-8 7" stroke="#f8991d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M394 200 l8 7 l-8 7" stroke="#f8991d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M589 200 l8 7 l-8 7" stroke="#f8991d" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="22" y="312" font-size="11" fill="#5b6472"><tspan>Fragen,</tspan><tspan> Blickwinkel</tspan><tspan> und</tspan><tspan> eine</tspan></text><text xml:space="preserve" x="22" y="327.5" font-size="11" fill="#5b6472"><tspan>Checkliste,</tspan><tspan> wie</tspan><tspan> Gutes</tspan></text><text xml:space="preserve" x="22" y="343" font-size="11" fill="#5b6472"><tspan>aussieht:</tspan><tspan> mit</tspan><tspan> KI</tspan><tspan> entworfen</tspan></text><text xml:space="preserve" x="22" y="358.5" font-size="11" fill="#5b6472"><tspan>und</tspan><tspan font-weight="700" fill="#1d1f25"> von</tspan><tspan font-weight="700" fill="#1d1f25"> Menschen</tspan><tspan font-weight="700" fill="#1d1f25"> freigegeben</tspan><tspan>.</tspan></text><text xml:space="preserve" x="217" y="312" font-size="11" fill="#5b6472"><tspan>Gefragt</tspan><tspan> wird</tspan><tspan> nach</tspan><tspan font-weight="700" fill="#1d1f25"> Ihrer</tspan></text><text xml:space="preserve" x="217" y="327.5" font-size="11" fill="#5b6472"><tspan font-weight="700" fill="#1d1f25">eigenen</tspan><tspan font-weight="700" fill="#1d1f25"> Prozesskarte</tspan><tspan>,</tspan></text><text xml:space="preserve" x="217" y="343" font-size="11" fill="#5b6472"><tspan>beantwortet</tspan><tspan> in</tspan><tspan> Ihren</tspan><tspan> Worten.</tspan></text><text xml:space="preserve" x="412" y="312" font-size="11" fill="#5b6472"><tspan>Beim</tspan><tspan> Antworten</tspan><tspan> liest</tspan><tspan> die</tspan><tspan> KI</tspan></text><text xml:space="preserve" x="412" y="327.5" font-size="11" fill="#5b6472"><tspan>auf</tspan><tspan font-weight="700" fill="#1d1f25"> Sinn,</tspan><tspan font-weight="700" fill="#1d1f25"> nicht</tspan><tspan font-weight="700" fill="#1d1f25"> auf</tspan><tspan font-weight="700" fill="#1d1f25"> Wortzahl</tspan></text><text xml:space="preserve" x="412" y="343" font-size="11" fill="#5b6472"><tspan>und</tspan><tspan> hakt</tspan><tspan> ab,</tspan><tspan> was</tspan><tspan> abgedeckt</tspan></text><text xml:space="preserve" x="412" y="358.5" font-size="11" fill="#5b6472"><tspan>ist.</tspan></text><text xml:space="preserve" x="607" y="312" font-size="11" fill="#5b6472"><tspan>Befunde</tspan><tspan> und</tspan><tspan> nächste</tspan><tspan> Schritte</tspan></text><text xml:space="preserve" x="607" y="327.5" font-size="11" fill="#5b6472"><tspan>warten,</tspan><tspan> bis</tspan><tspan> Sie</tspan><tspan> fertig</tspan><tspan> sind,</tspan></text><text xml:space="preserve" x="607" y="343" font-size="11" fill="#5b6472"><tspan>jeweils</tspan><tspan> mit</tspan><tspan font-weight="700" fill="#1d1f25"> Begründung</tspan><tspan>.</tspan><tspan> Sie</tspan></text><text xml:space="preserve" x="607" y="358.5" font-size="11" fill="#5b6472"><tspan>entscheiden.</tspan></text><path d="M20 390 H780" stroke="rgba(29,31,37,0.30)" stroke-width="0.9" stroke-dasharray="3 5" fill="none"/><text x="20" y="416" font-size="12.5" font-weight="700" fill="#1d1f25">Jede Methode wird in nummerierten Iterationen gepflegt</text><text xml:space="preserve" x="20" y="436" font-size="11" fill="#5b6472"><tspan>Ihr</tspan><tspan> Tisch</tspan><tspan> bleibt</tspan><tspan> bei</tspan><tspan> der</tspan><tspan> Iteration,</tspan><tspan> mit</tspan><tspan> der</tspan><tspan> er</tspan></text><text xml:space="preserve" x="20" y="451" font-size="11" fill="#5b6472"><tspan>begann,</tspan><tspan> bis</tspan><tspan> Sie</tspan><tspan> sich</tspan><tspan> fürs</tspan><tspan> Upgrade</tspan><tspan> entscheiden.</tspan></text><text xml:space="preserve" x="20" y="466" font-size="11" fill="#5b6472"><tspan>Ihre</tspan><tspan> Antworten</tspan><tspan> bleiben</tspan><tspan> immer</tspan><tspan> erhalten.</tspan></text><rect x="500" y="410" width="54" height="24" rx="12" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="1" /><text x="527" y="426" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1f25">1.0</text><rect x="590" y="410" width="54" height="24" rx="12" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="1" /><text x="617" y="426" font-size="12" font-weight="700" text-anchor="middle" fill="#1d1f25">2.0</text><rect x="680" y="410" width="54" height="24" rx="12" fill="none" stroke="#f8991d" stroke-width="1.6" stroke-dasharray="4 3"/><text x="707" y="426" font-size="12" font-weight="700" text-anchor="middle" fill="#f8991d">2.1</text><path d="M556 422 H586 M646 422 H676" stroke="rgba(29,31,37,0.30)" stroke-width="1.4" fill="none"/><path d="M617 440 l-5 8 h10 z" fill="#f8991d"/><text x="617" y="458" font-size="10.5" text-anchor="middle" font-weight="600" fill="#f8991d">Ihr Tisch</text><text x="707" y="458" font-size="10.5" text-anchor="middle" fill="#5b6472">Upgrade verfügbar</text></g>
