<g transform="translate(20 20)"><text x="400" y="22" font-size="17" font-weight="700" text-anchor="middle" fill="#1d1f25">A method is a discipline, not a prompt.</text><text x="400" y="41" font-size="11.5" text-anchor="middle" fill="#5b6472">Sample: Theory of Constraints, iteration 2.1</text><rect x="20" y="56" width="760" height="38" rx="10" fill="rgba(29,31,37,0.04)" stroke="rgba(29,31,37,0.30)" stroke-width="1" stroke-dasharray="4 4"/><text x="36" y="79" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#5b6472">JUST A PROMPT</text><rect x="176" y="67" width="48" height="16" rx="8" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><text x="200" y="79" font-size="11" font-weight="700" text-anchor="middle" fill="#5b6472">?</text><path d="M228 75 H246" stroke="rgba(29,31,37,0.30)" stroke-width="1.4" fill="none"/><path d="M250 75 l-6 -3.5 v7 z" fill="rgba(29,31,37,0.30)"/><rect x="254" y="67" width="34" height="16" rx="4" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><text x="271" y="79" font-size="10" font-weight="700" text-anchor="middle" fill="#5b6472">AI</text><path d="M292 75 H310" stroke="rgba(29,31,37,0.30)" stroke-width="1.4" fill="none"/><path d="M314 75 l-6 -3.5 v7 z" fill="rgba(29,31,37,0.30)"/><rect x="318" y="67" width="56" height="16" rx="8" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><path d="M328 75 H364" stroke="rgba(29,31,37,0.30)" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="394" y="79" font-size="11" fill="#5b6472">One question in, one answer out. Nothing checks it.</text><text x="20" y="122" font-size="13" font-weight="700" fill="#f8991d" letter-spacing="1.4">A LOOM METHOD</text><rect x="20" y="132" width="175" height="150" rx="14" fill="rgba(29,31,37,0.04)" stroke="rgba(29,31,37,0.30)" stroke-width="1.2"/><circle cx="40" cy="151" r="10" fill="#f8991d"/><text x="40" y="155.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14161c">1</text><text x="58" y="156" font-size="14" font-weight="700" fill="#1d1f25">The method</text><rect x="34" y="172" width="147" height="14" rx="4" fill="rgba(29,31,37,0.09)" stroke="#f8991d" stroke-width="1.6"/><circle cx="43" cy="179" r="2.6" fill="#f8991d"/><text x="52" y="182.5" font-size="9.5" fill="#1d1f25">Find the limit</text><rect x="34" y="190" width="147" height="14" rx="4" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><circle cx="43" cy="197" r="2.6" fill="#f8991d"/><text x="52" y="200.5" font-size="9.5" fill="#1d1f25">Get the most from it</text><rect x="34" y="208" width="147" height="14" rx="4" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><circle cx="43" cy="215" r="2.6" fill="#f8991d"/><text x="52" y="218.5" font-size="9.5" fill="#1d1f25">Feed it</text><rect x="34" y="226" width="147" height="14" rx="4" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><circle cx="43" cy="233" r="2.6" fill="#f8991d"/><text x="52" y="236.5" font-size="9.5" fill="#1d1f25">Raise it</text><rect x="34" y="244" width="147" height="14" rx="4" fill="rgba(29,31,37,0.09)" stroke="rgba(29,31,37,0.30)" stroke-width="0.9"/><circle cx="43" cy="251" r="2.6" fill="#f8991d"/><text x="52" y="254.5" font-size="9.5" fill="#1d1f25">Look ahead</text><rect x="45" y="273" width="125" height="18" rx="9" fill="#fff" stroke="#f8991d" stroke-width="1.2"/><text x="107.5" y="286" font-size="10" text-anchor="middle" fill="#f8991d" font-weight="700" letter-spacing=".8">EXPERT-APPROVED</text><rect x="215" y="132" width="175" height="150" rx="14" fill="rgba(29,31,37,0.04)" stroke="rgba(29,31,37,0.30)" stroke-width="1.2"/><circle cx="235" cy="151" r="10" fill="#f8991d"/><text x="235" y="155.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14161c">2</text><text x="253" y="156" font-size="14" font-weight="700" fill="#1d1f25">Your answers</text><rect x="229" y="194" width="30" height="9" 